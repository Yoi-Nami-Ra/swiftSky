# CI: runs Scripts/verify.sh, unchanged, on the self-hosted runner on the developer's Mac.
# Spec: specs/018-ci-verify-workflow (contract: contracts/verify-workflow.md).
# Runner install, start/stop and the merge rule: .github/RUNNER.md.
# Only two steps, by design (018 FR-004): verification is defined by the script, not here.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pull requests: a newer push cancels the older run. main: one group per run, so no main run is ever
# cancelled or dropped from the queue (018 research R4).
concurrency:
  group: verify-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, macOS, xcode-27]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: ./Scripts/verify.sh
