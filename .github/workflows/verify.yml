# CI: runs Scripts/verify.sh on a GitHub-hosted Apple silicon runner (free for public repositories).
# Spec: specs/018-ci-verify-workflow, amended by SKY-102 (2026-11-26). Notes and merge rule: .github/CI.md.
# Verification is defined by the script, not here; the other steps only prepare the toolchain.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: a newer push cancels the older run. main: one group per run, so no main run is ever
# cancelled or dropped from the queue (018 research R4).
concurrency:
  group: verify-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # GitHub-hosted. Never change this to a self-hosted runner: the repository is public (.github/CI.md).
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Ensure the Metal toolchain
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: ./Scripts/verify.sh
