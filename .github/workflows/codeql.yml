# CodeQL code scanning (free for public repositories). Advanced setup: keep GitHub's "default setup" off.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
          - language: c-cpp
            runner: ubuntu-latest
            build-mode: none
          # CodeQL supports Swift up to 6.3, so this job builds with Xcode 26, not the Xcode 27 that
          # verify.yml uses. Move it once CodeQL supports the newer Swift.
          - language: swift
            runner: macos-26
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode 26 and ensure the Metal toolchain
        if: matrix.language == 'swift'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Build the macOS app
        if: matrix.language == 'swift'
        run: |
          xcodebuild build -project swiftSky.xcodeproj -scheme 'swiftSky (macOS)' \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/codeql CODE_SIGNING_ALLOWED=NO -quiet
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
