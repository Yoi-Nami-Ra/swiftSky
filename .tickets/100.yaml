id: 100
title: "Make the failure notice readable in light appearance"
type: bug
description: |
  Found while verifying SKY-38 on the iPhone 17e simulator: with the system in
  light appearance, RendererFailureNotice's heading and body draw in the
  default (dark) label colour over the black window, so only the Quit button
  is visible. In dark appearance the text shows. SKY-7 evidently ran in dark
  appearance, so check 33 never saw it. This breaks 001 FR-025 (the notice
  must be readable), the same requirement SKY-38 fixed for large text sizes.

  Scope: make the notice readable in both appearances on iPhone and iPad, for
  example by fixing the notice's colour scheme or giving it its own
  background, without adding user-visible platform-UI pixels on the success
  path (001 FR-001 / FR-004a: the black window background is the one allowed
  exception). macOS is likely affected too: `NSRequiresAquaSystemAppearance =
  false` does not force dark appearance, it lets the app follow the system
  (only `true` forces light), and on macOS the notice sits on the same black
  background with default label colours. SKY-8's macOS check 33 PASS does not
  record the appearance (this Mac runs in dark). Check macOS in light
  appearance and fix it there too if it shows the same fault.

  Done when: in light and dark appearance, on the iPhone 17e and an iPad, at
  the default and the largest accessibility text size, and on macOS in light
  and dark appearance, the heading, body and Quit of the failure notice are
  all readable (Release build with the
  fragment entry point renamed, as in 001 check 33), and the result is
  recorded in the 001 quickstart.
platform: ios
status: in-review
phase: MVP
priority: medium
