id: 19
title: "Verify draw call via GPU frame capture on macOS"
type: task
description: |
  Quickstart checks 4 (SC-019, FR-002a) and 5 (FR-002b) of specs/001-metal-app-shell
  are open. Capture a frame of the macOS app in Xcode's GPU debugger and confirm
  a shader-backed draw call covers the surface (not a clear-only pass), and that
  the pipeline state and vertex buffer are reused across frames rather than
  rebuilt. Record the result in the quickstart. The iOS capture is SKY-18.

  SKY-18 closed the iOS half with lldb instead of a GPU capture
  (specs/021-ios-gpu-frame-capture/probe.sh). That probe is iOS-simulator only
  (simctl, the iOS scheme, the simulator's MTLSerializerRenderCommandEncoder);
  the same breakpoints on a macOS launch, or a capture, would do here.
platform: macos
