id: 89
title: "Spike: UI approach for docked and map screens"
type: spike
description: |
  Question: should management screens (docked screen SKY-51, market SKY-53,
  galaxy map SKY-56, outfitter SKY-75) be SwiftUI views over the Metal
  surface or drawn in Metal (SKY-28's text), considering accessibility
  (VoiceOver, Dynamic Type), iPad Split View, macOS windowing, input
  handling and the frame budget while a screen is open?

  Approach: a throwaway POC of one docked screen both ways on a
  poc/ui-approach branch that is never merged; check VoiceOver, Dynamic Type
  and frame times on iOS and macOS.

  Done when: a recommendation with evidence is under Findings and the
  follow-up tickets (if any) are named.

  Findings (2026-11-04):
  Recommendation: SwiftUI views over the Metal surface (approach A), with
  spec 001 FR-001/FR-007 amended to allow platform-UI management screens.
  The HUD and anything drawn in the game world stay in Metal.

  POCs (never merged, not pushed; local worktrees under .claude/worktrees/):
  A poc/ui-approach-swiftui 372fd4c, 6 files +255/-10; B
  poc/ui-approach-metal dc7a736, 17 files +1,470/-7 (about 1,170 source,
  290 tests). Same docked screen in both, opened with --debug-docked:
  title, Leave, Trade, a 10-row scrolling list with live prices.

  Frame cost does not decide it. Instrumented build, screen closed vs open:
  mean frame +0.014 ms (A) and +0.035 ms (B) on macOS at 120 Hz; +0.066 ms
  (A) and none (B) on the iOS simulator; no dropped frames and no
  frame-loop allocations in either.

  Accessibility and layout decide it. A gets VoiceOver, Dynamic Type
  (wrapping at AX5), keyboard (Escape) and Split View from the platform. B
  needed a second text renderer and atlas, and a hand-built VoiceOver
  mirror over a new loop-to-main channel (about 230 lines). It still has no
  wrapping, no text beyond ASCII, no keyboard focus, no Dynamic Type on
  macOS, and on macOS VoiceOver cannot reach rows scrolled out of view.
  Both passed Accessibility Inspector on the iOS simulator (order title,
  Leave, Trade, rows; game surface not reachable; no Audit warnings),
  VoiceOver and live resize on macOS, and iPad Split View at 1/3 width.
  On the simulator both kept taps on the screen from becoming move orders,
  and Leave handed input back to the game.

  A's cost: its main thread works. Worst main-thread stretch with the
  screen open was 273 ms once on the iOS simulator (idle), and up to
  202 ms while tapping, scrolling and changing text size; B stayed under
  25 ms. Simulator only, not yet seen on a device. A also needs, per
  screen, an intent event, a snapshot type and a low-rate publish from the
  frame loop; publishing allocates, so it sits outside the counted
  stretch. One frame showed allocs=1 during the A run on the simulator.

  Follow-ups: SKY-90 (amend spec 001 for platform-UI management screens),
  SKY-91 (spike: measure A's main-thread stalls on a device and find their
  source), SKY-92 (loop-to-main snapshot channel and screen intents;
  SKY-51 waits on it).
