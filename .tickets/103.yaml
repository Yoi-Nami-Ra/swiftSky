id: 103
title: "iPad: app runs in portrait despite landscape-only Info.plist"
type: bug
description: |
  Found during SKY-100 (PR 10): on the iPad Air 11-inch (M4) simulator,
  with the simulator in portrait, swiftSky ran full screen in portrait.
  `Apps/iOS/Info.plist` allows only `UIInterfaceOrientationLandscapeLeft`
  and `...Right` under `UISupportedInterfaceOrientations~ipad` (001
  FR-006b). The 001 quickstart's "Portrait device orientation - not
  reachable" (around line 758) was observed by turning the iPhone 17e, not
  an iPad, so it never covered this.

  **Already in place**: the plist lists, `UIApplicationSupportsMultipleScenes`
  false (FR-006c), and no `UIRequiresFullScreen` (deprecated as of iOS 26.0;
  do not re-add it). `MetalSurfaceView` already fills any size it is given
  and recomputes `drawableSize` on layout. There is no scene or orientation
  code in `Sources` or `Apps`. FR-006b already requires tolerating arbitrary
  surface sizes, since multitasking can hand the app sizes that match no
  orientation.

  **Scope**
  1. Wait for SKY-104's findings (whether iPadOS 27 ignores the orientation
     list and whether any supported way holds landscape).
  2. If landscape can be held, in code or plist, do it on iPad, and keep
     iPhone as it is (iPhone portrait is already refused, 001 check 11).
  3. If it cannot be held, amend 001 FR-006b to: landscape only where the
     platform allows; on iPad the app accepts any window shape, including
     full-screen portrait. Keep the surface-fills-any-size sentence.
  4. Re-run the quickstart's "Portrait device orientation" note on an iPad
     (Air 11-inch and mini), and record there what the iPad does.
  5. Check that the surface and the failure notice lay out correctly in
     portrait on both iPads.

  **Out of scope**: the 1/3-width Split View check (SKY-6, 001 check 12);
  any change to macOS; adding `UIRequiresFullScreen` back.

  **Open questions**: SKY-104 (spike) must answer whether landscape can be
  enforced on iPadOS 27 at all. The end state (scope 2 or 3) follows from it.

  **Done when**: in portrait on an iPad Air 11-inch and an iPad mini, the app
  is either held to landscape as FR-006b says, or FR-006b is amended, and in
  both cases the 001 quickstart records what the iPad does and that the
  surface and the failure notice lay out correctly there (checked by
  screenshot on both simulators). `./Scripts/verify.sh` passes.
