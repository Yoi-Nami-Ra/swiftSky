id: 42
title: "Make the camera follow the ship"
type: feature
description: |
  Today the camera is fixed with the world origin at the centre of the
  surface (SKY-23, specs/005), so the ship can never leave the screen. Make
  the camera follow the ship so the world is bigger than one screen. SKY-23
  listed following the ship as "not planned; needs its own ticket" — this is
  that ticket. Split out of SKY-40, whose off-screen arrow only makes sense
  with it.

  Decided (2026-10-02, from the user's idea): the camera stays centred on
  the ship, hard-locked. No dead zone, no smoothing, no lead, so Reduce
  Motion has nothing extra to turn off. The planet stays fixed at world
  (0, 0) (SKY-40). One world unit stays one point; zoom is SKY-45. The
  background (SKY-35) stays fixed to the screen.

  Already in place: Camera (Sources/SwiftSkyRendering/Camera.swift) maps
  world, view and clip with the origin at the centre of the whole surface,
  and is nil for an unusable surface (SKY-23). Taps and clicks reach
  MoveOrderRequest as a view position and are converted against the surface
  at that event (SKY-10, SKY-11). The ship sprite is placed through the
  camera (SKY-27). Planned-path points are world positions (SKY-26).

  Scope:
  1. Camera gets a world-space centre, a required parameter with no default.
     The view centre stays the centre of the whole surface, not the safe
     area. World to view, view to world and world to clip all subtract the
     centre. A non-finite centre gives nil, like an unusable surface.
  2. The frame loop sets the centre every frame to the ship's blended pose
     from SKY-12 (position only; heading does not rotate the view). The
     sprite, and later the order overlay (SKY-30) and the planet (SKY-40),
     are drawn through that same camera.
  3. MoveOrderRequest.apply takes the camera centre the last frame was drawn
     with, so a tap or click lands on the world point under the finger.
  4. An instrumented-builds-only --debug-world-grid launch argument draws a faint
     grid fixed to the world, so movement is visible before the planet
     exists. It follows 011's check-25 allocation rules: built once, fixed
     capacity.

  Out of scope: zoom (SKY-45); the planet and its arrow (SKY-40, SKY-43); a
  radar layer (SKY-44); the order overlay (SKY-30, which only needs to draw
  through the same camera); smoothing, lead or a dead zone (decided
  against); a scrolling background (SKY-35 keeps it fixed).

  Done when:
  - Tests: with centre c, the world point c maps to the surface centre, and
    view to world to view round-trips within 1e-9 points at 1x, 2x and 3x,
    including odd sizes; a centre of (0, 0) reproduces every 005 result; a
    non-finite centre gives nil; a tap at the surface centre orders the
    camera centre, and a tap at offset d from the centre orders centre + d
    (x right, y flipped).
  - Ship placement with centre = ship position puts the sprite at the
    surface centre for any ship position.
  - On iOS and macOS the ship stays centred while it flies, the grid
    scrolls past it, and a tap or click made while moving puts the order at
    the point under the finger (the log's world= matches).
  - 011's check 25 still reports zero allocations per frame on both
    platforms, and frame times stay within budget.

  Picked by the refinement, change if wrong: the view centre is the whole
  surface; a tap converts through the centre the last frame drew; SKY-30 is
  not blocked by this ticket.
