id: 43
title: "Design: planet sprite"
type: task
description: |
  Why it's needed: SKY-40 draws a planet at the world origin as a landmark,
  drawn from an image like the ship (SKY-27). No planet art exists.

  When it shows: always, at the world origin, behind the ship and above the
  space background (SKY-35).

  Built from: design/sprites/ship.png for format and style (a square,
  transparent PNG, top-down) and design/backgrounds/space.jpg for palette.
  The background has a blue nebula and two small painted planets, so this
  planet must read as a game object, not as one of those.

  Proposal: a warm rocky or desert planet in orange-brown with a thin
  atmosphere glow and no ring, lit from the upper left with a soft
  terminator and no fully black side. 2-3 variants as
  design/proposal/43-planet-<variant>.png; the chosen one becomes
  design/sprites/planet.png and the proposals are deleted.

  Spec:
  1. 1024 x 1024 px, sRGB, transparent PNG.
  2. The disc spans the full image width and height, so the disc is exactly
     the 200 world units SKY-40 draws (600 px at 3x). Corners are
     transparent, edges anti-aliased, any atmosphere glow inside the disc
     edge.
  3. No ring, moons or text, so the outline stays a clean circle for
     SKY-40's off-screen test.

  Open questions: none beyond approval of the variants.

  Done when: design/sprites/planet.png exists and is approved, the proposal
  files are deleted, this ticket's `designs` and SKY-40's `designs` point at
  it, and the disc measures 1024 px across (checked on the file).
platform: macos
