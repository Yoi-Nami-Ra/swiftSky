  - 008 check 10 (SC-007a): with VoiceOver on, tap the surface; the ship flies
    to the tapped point (.allowsDirectInteraction), and focus still reads
    "swiftSky game surface".
  - 001 check 33 (FR-025): Release build with the fragment shader entry point
    renamed (revert afterwards); confirm VoiceOver reads the failure notice.

  Record results in each spec's quickstart. The macOS VoiceOver run is SKY-8.
