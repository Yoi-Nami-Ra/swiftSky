id: 27
title: "Render the ship sprite"
type: feature
description: |
  Rendering layer. Draw the ship from design/sprites/ship.png (80×80, with
  alpha; the top of the image is the ship's front) at the ship's position
  and heading from SimulationState, through the camera transform from SKY-23.

  - Add the image to the app's resources and load it into a texture once at
    startup; a missing texture is a renderer-init failure (like FR-024/FR-026).
  - Add a textured-quad pipeline with alpha blending over the black
    background. Pipeline, texture and geometry are created once and reused
    (as FR-002b); no per-frame allocation.
  - Extend the logic → render hand-off with the ship's pose; the renderer
    still never writes back to logic.
  - Supersedes 001's FR-002 (uniformly black surface) — see SKY-22.

  Done when the ship shows at the world origin facing heading zero on both
  platforms, rotates correctly, and holds its size and aspect across window
  resizes.
platform: macos
status: done
phase: Phase0
priority: high
parent: 22
blocked_by: [23, 24]
designs:
  - design/sprites/ship.png
