title: "Set prices from supply and demand"
type: feature
description: |
  Part of SKY-66. Replace SKY-53's fixed prices with prices derived from each
  station's stock against its target level (scarce means dear), within a
  floor and ceiling per commodity.

  Done when: headless tests cover the price curve; selling a lot at one
  station lowers its price there.
