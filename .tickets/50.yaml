id: 50
title: "Dock at a planet or station"
type: feature
description: |
  Part of SKY-48. A dock order: tapping or clicking a dockable body (SKY-49)
  orders the ship to it; the autopilot (SKY-25) flies there and keeps
  station, and once inside the docking radius and nearly at rest the ship is
  docked. Undocking puts the ship back just outside the radius at rest.

  Done when: tests cover the docked condition (radius, speed threshold) and
  undocking; docking and undocking work on iOS and macOS; the order overlay
  (SKY-30) shows a dock target.
platform: macos
status: ready
phase: Phase1
priority: medium
