id: 49
title: "Model a star system with planets and stations"
type: feature
description: |
  Part of SKY-48. A star system in the logic layer: a star, planets and
  stations, each with a world position (fixed, or on a simple circular orbit
  driven by the simulation tick) and a size. The current single landmark
  planet (SKY-40) becomes one body in this model.

  Scope:
  1. Value types for system, body (star, planet, station) and their data,
     loaded from a bundled data file so new systems need no code.
  2. Draw every body with its sprite (default art from SKY-87), above the
     background and below the ship, reusing SKY-27's sprite pipeline.
  3. No gravity or collision; the ship flies over bodies.

  Done when: headless tests cover loading and orbit positions per tick; one
  system with a star, two planets and a station is drawn on iOS and macOS;
  011's check 25 still reports zero allocations per frame.
platform: macos
status: ready
phase: Phase1
priority: medium
parent: 48
