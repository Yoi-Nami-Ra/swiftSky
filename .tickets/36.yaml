id: 36
title: "Replace the Profiling build with an instrumented script"
type: bug
description: |
  The Profiling configuration is meant to be an optimised build with the frame
  instrumentation compiled in (001 research R12, FR-021e), but it carries none
  of it. Found while planning SKY-3 (specs/011-draw-allocation-counter,
  research R1).

  Already in place: Package.swift defines SWIFTSKY_INSTRUMENTATION only
  `.when(configuration: .debug)` (Swift and C settings). SwiftPM knows only
  Debug and Release, and Xcode builds every package target as Release when
  the app uses Profiling, so the define reaches the app module only. A
  Profiling binary has no frame summary, no allocation counter and no debug
  overlay (`strings -a … | grep dropped=` → 0). 011 research R12 has the
  working method: a Release build with
  'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) SWIFTSKY_INSTRUMENTATION'
  and 'GCC_PREPROCESSOR_DEFINITIONS=$(inherited) SWIFTSKY_INSTRUMENTATION=1'
  on the xcodebuild command line, which reaches the package targets too. The
  Xcode schemes are not shared, so no checked-in scheme uses Profiling.

  Scope:
  1. Remove the Profiling configuration from swiftSky.xcodeproj (its project
     and target build-configuration blocks), leaving Debug and Release.
  2. Add Scripts/build-instrumented.sh: builds the iOS (simulator) and/or
     macOS app in Release with the two overrides above, into a fixed derived
     data folder, and prints the path of each built app. Takes the platform
     as its only argument (ios, macos, or both by default).
  3. Guard it in Scripts/verify.sh: build the instrumented macOS app and
     check its binary contains the frame-summary strings (`dropped=`), and
     check the Release binary contains none (001 check 27). Both checks fail
     the run.
  4. Update the docs from "Debug/Profiling" to "Debug and instrumented
     Release builds": CLAUDE.md (6 places), the 001 plan's Complexity
     Tracking row for the third build configuration, and 011 quickstart's
     "The method", which then calls the script.
  5. Annotate 008 quickstart check 12 and 009 quickstart check 9: a Profiling
     build carried no package instrumentation, so the recorded frame figures
     cannot have come from it; point to the script for any future
     measurement. Their results are not re-run: the "before" baselines were
     built from older commits.
  6. Leave a note in the other quickstarts (001–004, 006, 007, 010) only
     where they say a check was run on a Profiling build; elsewhere the
     wording follows step 4.

  Out of scope: changing what the instrumentation measures, adding
  instrumentation to plain Release, and re-running 008 #12 and 009 #9.

  Done when:
  - `xcodebuild -list` shows only Debug and Release.
  - `./Scripts/build-instrumented.sh macos` builds an optimised app whose log
    shows `allocation counter ready` and frame summaries, and whose binary
    contains `dropped=`; the same on iOS in the simulator.
  - `./Scripts/verify.sh` passes, and fails if the overrides are removed from
    the script (tried once, then restored).
  - No "Profiling build" remains in CLAUDE.md or the 001 plan, and 008 #12
    and 009 #9 carry the annotation.
