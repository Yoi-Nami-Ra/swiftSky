id: 36
title: "Carry instrumentation into Profiling builds"
type: bug
description: |
  The Profiling configuration is meant to be an optimised build with the frame
  instrumentation compiled in (001 research R12, FR-021e), but it carries none of
  it. Found while planning SKY-3 (specs/011-draw-allocation-counter, research R1):
  SWIFTSKY_INSTRUMENTATION is set on the Xcode project's Profiling configuration
  and reaches only the app module. SwiftPM knows only Debug and Release, so Xcode
  builds every package target (SwiftSkyPlatform, SwiftSkyRendering,
  SwiftSkyAllocationCounter) with its Release settings: -O, no define. A Profiling
  binary has no frame summary, no allocation counter and no debug overlay
  (`strings -a … | grep dropped=` → 0).

  Effect: any evidence recorded as coming from a "Profiling build" — 008 quickstart
  check 12, 009 check 9 — could not have come from the package's instrumentation
  and should be re-read. Today's workaround (011 research R12): a Release build
  with 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) SWIFTSKY_INSTRUMENTATION'
  and 'GCC_PREPROCESSOR_DEFINITIONS=$(inherited) SWIFTSKY_INSTRUMENTATION=1' on the
  xcodebuild command line, which reaches package targets too.

  Open questions:
  - Fix: keep Profiling and pass the define to package targets some other way
    (an xcconfig, a scheme, a build-setting override Xcode applies to packages),
    or drop the Profiling configuration and document the command-line Release
    build as the profiling build?
  - Should Scripts/verify.sh build Profiling and check that the summary strings
    are present, so this cannot regress silently?
  - Re-run or annotate 008 #12 and 009 #9.

  Done when a Profiling build (or its documented replacement) is optimised and
  contains the instrumentation, Release still contains none of it (001 check 27),
  and the affected quickstart checks are corrected.
