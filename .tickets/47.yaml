id: 47
title: "Stop the frame budget locking onto stray gaps"
type: bug
description: |
  Part of SKY-22. The frame loop learns the display's frame budget from the
  gaps between `CAMetalDisplayLink` target timestamps
  (`FrameLoop.learnDisplayInterval`, Sources/SwiftSkyPlatform/FrameLoop.swift).
  A gap shorter than the current budget becomes a candidate, and a later gap
  within 5% of it confirms it; the budget becomes the smaller of the two and
  only ever shrinks until the backing scale changes.

  Observed 2026-10-06 on the iPhone 17 Pro simulator (Debug, Mac heavily
  loaded, ~45 fps against a 60 Hz link): about 6 minutes into the run the
  budget switched from 16.67 ms to 14.84 ms (~67 Hz). That restarted the
  counters (`updateBudget`), and from then on every frame was judged against
  a budget the display never had.

  Seen again 2026-10-06 on macOS (002 check 20 run, Debug): the window moved
  from the 120 Hz built-in display back to the 60 Hz external display, and
  every later summary still read `budget=8.333333ms` while arriving every
  2.0 s per 120 frames (60 Hz). The backing-scale change forgot the interval,
  but it was relearned at 8.33 ms, most likely from gaps the display link
  still produced at 120 Hz during the move, and it never rose again.

  And a third time the same day (003 check 7, macOS Debug, 120 Hz built-in
  display): right after a live resize the budget dropped to 4.174125 ms
  (240 Hz), half the real interval, so the resize produced two agreeing
  half-interval gaps. From then on any frame over 4.17 ms counted as
  dropped; one 5.13 ms frame did. A window resize is enough to trigger it,
  so it affects ordinary macOS sessions, not only loaded simulators.

  Cause:
  - The candidate never expires. A gap no shorter than the known interval
    returns early without clearing `candidateInterval`, so a stray short gap
    early in a run waits indefinitely and can be confirmed by another stray
    gap minutes later. The comment's premise, that a spurious gap "never"
    has a partner, holds only when the two must be consecutive.
  - The method assumes gaps are whole display intervals. That holds on a real
    120 Hz panel (the comment's evidence), but not on a CPU-starved simulator,
    where a late frame is followed by a short catch-up gap.
  - The budget never rises again, so one false confirmation lasts the whole
    run.

  Effect: instrumentation only (`dropped`, the overlay's budget line, SC-003
  readings) in Debug and Profiling builds. The simulation clock and drawing
  are untouched. Real hardware is exposed too: two jitter gaps agreeing to
  within 5% anywhere in a long session on a variable-refresh display would
  trigger it.

  Scope:
  1. Accept a candidate only when the very next plausible gap agrees with it;
     any other gap clears it.
  2. Move the learner out of `FrameLoop` into a small pure struct in the
     platform layer (like `FrameTimeWindow`), so it can be tested without a
     Metal device. `FrameLoop` keeps calling it once per frame and calls
     `updateBudget` when it reports a new interval. Allocation-free.
  3. Learn only gaps the display can really produce. Item 1 does not cover
     this: two back-to-back 120 Hz gaps during a display move, or two 4.17 ms
     gaps during a live resize, still agree. Options: never let the interval
     go below the current screen's `maximumFramesPerSecond` (covers both), or
     skip a settling period after a backing-scale change or resize. Choose
     in the plan.
  4. Update the comments that state the old premise.

  Out of scope: changing how dropped frames are defined or counted, and the
  main-thread stall at the end of live resize (SKY-37).

  Done when:
  - Headless tests in `Tests/SwiftSkyPlatformTests/` cover: a steady 120 Hz
    series settles on 8.33 ms; a 60 Hz series with one doubled gap stays at
    16.67 ms; two matching short gaps separated by normal ones are not
    adopted; simulator-like jitter (a late gap followed by a catch-up gap)
    does not lower the budget; a single startup outlier is ignored; after a
    display change, a few 120 Hz gaps followed by steady 60 Hz gaps end on
    16.67 ms; on a steady 120 Hz series, a burst of 4.17 ms gaps (a live
    resize) does not lower the budget.
  - `./Scripts/verify.sh` passes.
  - A 10-minute Debug run on the iOS simulator under load keeps
    `budget=16.666667ms` in every summary.
platform: ios
